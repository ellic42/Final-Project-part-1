<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="UTF-8">
        <title>Contact Form</title>
    </head>
    <body>
        <h1>Contact Inquiry</h1>
        <br>
    </body>
    <section>
        <div id="form">

            <h2>Please fill out the form below for any inquiries!</h2>
          <!-- Start Form -->
            <form class="form-grid">
                <fieldset>
                    <legend>Client Info</legend>
                    <label for="fName">First Name:</label>
                    <input type="text" name="fName" id="fName" required>

                    <label for="lName">Last Name:</label>
                    <input type="text" name="lName" id="lName" required>
					
					
					<label for ="email">Email:</label>
					<input type="email" name="email" id="email" required>
					

					<label for="phone">Phone:</label>
					<input type="tel" id="phone" name="phone" required>
                </fieldset>

				<fieldset>
					<legend>Inquiry Type</legend>
					<label for="type">What service are you inquiring about?</label>
					<select name="type" id="type">
						<option value="web">Web Design</option>
						<option value="code">Coding</option>
						<option value="graphic">Graphic Design</option>
						<option value="other">Other</option>
					</select>

					<label for="other">Other:</label>
					<textarea id="other" name="other" rows="5" cols="35">
					</textarea>
				</fieldset>
				
				<input type="submit" id="submit" value="Submit" class="btn">
            </form>
    </section>
</html>
